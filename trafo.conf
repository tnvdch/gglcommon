# trafo configuration file
#
# you must export the environment variable TRAFOCONF
# to point at this file for the routines to work.

# formtype name col1 col2 col3
# possible col values: x y z n (Northing) e (Easting) h (height)
#    lat (latitude in [deg]) lon (longitude in [deg])
#    rlat rlon (same in [rad])
#    glat glon (same in [grad])
#    dmslat dmslon (same in degrees, minutes and seconds)
#
formtype xyz x y z
formtype yxz y x z
formtype llh lat lon h
formtype dmsllh dmslat dmslon h
formtype swissxyh n e h
formtype swissyxh e n h
formtype neh n e h
formtype enh e n h

# frame source target dx  dy  dz  scale  angletype alpha beta gamma epoch
#                    [m] [m] [m]  [ppm]  one of deg, '', rad, cc
# rate source target ddx ddy ddz dscale angletype dalpha dbeta dgamma
# frame rate respective to epoch in [y]
#
# /Xt\   /dx\   /     m      sin gamma -sin beta \   /Xs\
# |Yt| = |dy| + |-sin gamma      m      sin alpha| * |Ys|
# \Zt/   \dz/   \ sin beta  -sin alpha      m    /   \Zs/
#
# in above formula, the cosine of the angles are set to 1, but in
# the programs they are calculated, the used matrix is thus orthogonal
# index s stands for source, t for target.
#
frame ch1903+ etrf 674.374 15.056 405.346 0.0 deg 0.0 0.0 0.0 0.0
frame ch1903 wgs84 660.077 13.551 369.344 5.66 cc 2.484 1.783 2.939 0.0
#frame ch1903 wgs84 660.077 13.551 369.344 5.66 cc -2.484 -1.783 -2.939 0.0
frame itrf94 etrf 0.041 0.041 -0.049 0.0 cc 0.0 0.0 0.0 1989.0
rate itrf94 etrf 0.0 0.0 0.0 0.0 cc -0.0006 -0.0015 0.002
frame itrf94 itrf92 0.008 0.002 -0.008 -0.0008 cc 0.0 0.0 0.0 0.0
frame etrf wgs84 0.055 -0.541 -0.185 -0.014 cc -0.057 0.001 -0.022 0.0
frame itrf93 etrf 0.019 0.053 -0.021 0.0 cc 0.0 0.0 0.0 1989.0
rate itrf93 etrf 0.0 0.0 0.0 0.0 '' -0.00032 -0.00078 0.00067


# ellipsoid definitions: must contain four elements
# keyword identifier a e2
# where:
# keyword == ellipsoid
# identifier == a name for the ellipsoid
# a == large semiaxis
# e2 == square of the excentricity

# dummy ellipsoid to signify no ellipsoid to use
# must exist for most applications
ellipsoid xyz 0.0 0.0

#
# spheres
#
ellipsoid sphere1 1.000 0.0
ellipsoid sphere 6378137.000 0.0

#
# some ellipsoids
#
ellipsoid ed50 6378388.000 0.00672267
ellipsoid wgs72 6378135.000 0.00669431778
ellipsoid wgs84 6378137.000 0.00669438
ellipsoid grs80 6378137.000 0.00669438002290079
ellipsoid bessel 6377397.155 0.006674372230614

# geoid definitions
# keyword identifier colx coly height grid_type <filename || number>
# grid types: dsaa = surfer grid format ASCII, gmt = gmt format (number)
geoid gurtner e n dsaa /home/favey/project/geoid.grd
geoid marti e n dsaa /home/favey/gglprogs/src/GEOID/chgeo98ch.grd
